<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paiement Réussi</title>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f3f4f6;
    }
    .card {
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 400px;
    }
    .icon {
      width: 80px;
      height: 80px;
      background-color: #def7ec;
      color: #03543f;
      border-radius: 50%;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      font-size: 40px;
      margin-bottom: 20px;
    }
    h1 { color: #111827; margin: 0 0 10px; font-size: 24px; }
    p { color: #6b7280; margin-bottom: 24px; line-height: 1.5; }
    .btn {
      display: inline-block;
      background-color: #0e9f6e;
      color: white;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 6px;
      font-weight: 500;
      transition: background-color 0.2s;
    }
    .btn:hover { background-color: #057a55; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✓</div>
    <h1>Paiement Réussi !</h1>
    <p>Merci ! Votre abonnement a été activé avec succès. Vous pouvez maintenant fermer cette fenêtre et retourner sur l'application.</p>
    <a href="/" class="btn">Retour à l'accueil</a>
  </div>
</body>
</html>
